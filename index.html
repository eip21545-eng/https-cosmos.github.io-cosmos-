
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<meta name="description"
 content="COSMOS, actualidad y exploración del universo">
<title>COSMOS · Tu universo</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<style>
:root {
  --bg:#0b1024;
  --card:#19213d;
  --border:#303b5d;
  --accent:#c5b4ff;
  --text:#f8f7ff;
  --muted:#aeb9d3;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

header {
  position:sticky;
  top:0;
  z-index:5;
  padding:16px;
  background:#101730;
  border-bottom:1px solid var(--border);
}

header .inside {
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

h1 {
  font-size:25px;
  letter-spacing:2px;
  margin:0;
}

h2 {font-size:25px;margin:17px 0}
h3 {font-size:18px;margin:10px 0}

p {color:#d2dbef;line-height:1.6}

small,.muted {color:var(--muted)}

#estado {
  font-size:11px;
  padding:9px 12px;
  border-radius:30px;
  background:#21304a;
  color:#d7e6ff;
  text-align:center;
}

#estado.ok {
  background:#183c34;
  color:#99f3ca;
}

#estado.error {
  background:#47302e;
  color:#ffceae;
}

main {
  max-width:1000px;
  margin:auto;
  padding:20px 15px 110px;
}

section {display:none}
section.active {display:block}

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin:14px 0;
}

.pad {padding:18px}

.card img {
  display:block;
  width:100%;
  max-height:400px;
  object-fit:cover;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.tile {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  color:white;
  text-align:left;
  padding:18px;
  min-height:115px;
  cursor:pointer;
}

.tile .emoji {
  display:block;
  font-size:29px;
  margin-bottom:8px;
}

.tile small {display:block;margin-top:5px}

.tag {
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.btn {
  display:inline-block;
  background:var(--accent);
  color:#13152d;
  padding:11px 14px;
  border-radius:11px;
  text-decoration:none;
  font-weight:700;
  border:0;
  margin:5px 5px 5px 0;
  cursor:pointer;
}

.btn.secondary {
  background:#2c3859;
  color:white;
}

.article {
  padding:17px;
  border-bottom:1px solid var(--border);
}

.article:last-child {border-bottom:0}
.article h3 {line-height:1.4}
.article p {margin:8px 0}

.gallery {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.gallery .card {margin:0}
.gallery img {height:155px;object-fit:cover}
.gallery h3 {font-size:15px}

.notice {
  background:#242d4c;
  border-left:3px solid var(--accent);
  border-radius:9px;
  padding:15px;
  margin:15px 0;
  color:#e4e9fa;
  line-height:1.5;
}

.tabs {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:6px 0;
}

.tabs button {
  border:1px solid var(--border);
  background:var(--card);
  border-radius:30px;
  padding:10px 15px;
  color:white;
  white-space:nowrap;
}

.tabs button.selected {
  background:var(--accent);
  color:#12162d;
}

nav {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:space-around;
  gap:2px;
  background:#11182f;
  border-top:1px solid var(--border);
  padding:8px 3px calc(9px + env(safe-area-inset-bottom));
  z-index:10;
}

nav button {
  background:none;
  border:0;
  color:#aeb9d3;
  min-width:54px;
  padding:5px 2px;
  font-size:11px;
  cursor:pointer;
}

nav button span {
  display:block;
  font-size:23px;
  margin-bottom:4px;
}

nav button.active {color:var(--accent)}

footer {
  padding:20px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

@media(min-width:700px) {
  .grid {grid-template-columns:repeat(3,1fr)}
  .gallery {grid-template-columns:repeat(3,1fr)}
}

</style>
</head>

<style>
#cosmosInstalar {
  position:fixed;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);
  width:min(90%,360px);
  padding:16px;
  border:0;
  border-radius:16px;
  background:#c5b4ff;
  color:#10152b;
  font-size:16px;
  font-weight:bold;
  z-index:999;
  cursor:pointer;
  box-shadow:0 8px 25px #0007;
  display:none;
}

#cosmosModal {
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#cosmosModalContenido {
  background:#19213d;
  color:white;
  padding:25px;
  border-radius:20px;
  max-width:380px;
  width:100%;
  line-height:1.6;
}
</style>

<button id="cosmosInstalar">
  📲 Instalar COSMOS gratis
</button>

<div id="cosmosModal">
  <div id="cosmosModalContenido">
    <h2>Instalar COSMOS 🌌</h2>
    <p id="cosmosInstrucciones"></p>
    <button class="btn" id="cosmosCerrar">
      Entendido
    </button>
  </div>
</div>

<script>
(function () {
  let eventoInstalacion = null;

  const boton = document.getElementById("cosmosInstalar");
  const modal = document.getElementById("cosmosModal");
  const instrucciones = document.getElementById("cosmosInstrucciones");

  const instalada =
    window.matchMedia("(display-mode: standalone)").matches ||
    navigator.standalone === true;

  if (instalada) return;

  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" &&
     navigator.maxTouchPoints > 1);

  const android = /Android/i.test(navigator.userAgent);

  function mostrarAyuda() {
    instrucciones.textContent = ios
      ? "Abre COSMOS en Safari, pulsa Compartir y después Añadir a pantalla de inicio. Activa Abrir como app si aparece."
      : "Abre COSMOS en Chrome, pulsa los tres puntos y selecciona Instalar aplicación o Añadir a pantalla de inicio.";

    modal.style.display = "flex";
  }

  window.addEventListener("beforeinstallprompt", function(e) {
    e.preventDefault();
    eventoInstalacion = e;
    boton.style.display = "block";
  });

  if (ios || android) {
    boton.style.display = "block";
  }

  boton.addEventListener("click", async function() {
    if (eventoInstalacion) {
      const evento = eventoInstalacion;
      eventoInstalacion = null;
      await evento.prompt();
      const resultado = await evento.userChoice;

      if (resultado.outcome === "accepted") {
        boton.style.display = "none";
      }
    } else {
      mostrarAyuda();
    }
  });

  document.getElementById("cosmosCerrar")
    .addEventListener("click", function() {
      modal.style.display = "none";
    });

  window.addEventListener("appinstalled", function() {
    boton.style.display = "none";
  });
})();
</script>

<body>

<header>
  <div class="inside">
    <div>
      <h1>✦ COSMOS</h1>
      <small>Tu universo, cada día</small>
    </div>
    <div id="estado">Conectando...</div>
  </div>
</header>

<main>
  <section id="inicio" class="active"></section>
  <section id="noticias"></section>
  <section id="cielo"></section>
  <section id="explorar"></section>
  <section id="aprender"></section>
</main>

<nav>
  <button data-page="inicio" class="active">
    <span>⌂</span>Inicio
  </button>
  <button data-page="noticias">
    <span>📰</span>Noticias
  </button>
  <button data-page="cielo">
    <span>☾</span>Mi cielo
  </button>
  <button data-page="explorar">
    <span>🚀</span>Explorar
  </button>
  <button data-page="aprender">
    <span>✧</span>Aprender
  </button>
</nav>

<footer>
  COSMOS · Información científica de fuentes oficiales.
  Proyecto independiente, no afiliado a la NASA.
</footer>

<script>
"use strict";

/*
 PEGA AQUÍ TU URL REAL DE APPS SCRIPT.
 Debe terminar en /exec.
*/

const API_URL = "https://script.google.com/macros/s/AKfycbwJA5QiFHx0oJ3KX2IU3xKbXWxr1mc1oj5H8wxXly3OZByXsOg08JvUVKvbtTZ2KkHp/exec";

let datos = {
  imagen:null,
  galeria:[],
  noticias:[],
  misiones:[],
  asteroides:[],
  errores:[]
};

let pagina = "inicio";
let tema = "planetas";

const enlaces = {
  nasa:"https://www.nasa.gov/",
  noticias:"https://www.nasa.gov/news/",
  ciencia:"https://science.nasa.gov/",
  imagen:"https://science.nasa.gov/astronomy-picture-of-the-day/",
  galeria:"https://images.nasa.gov/",
  artemis:"https://www.nasa.gov/mission/artemis/",
  asteroides:"https://cneos.jpl.nasa.gov/ca/",
  stellarium:"https://stellarium-web.org/",
  luna:"https://science.nasa.gov/moon/",
  sky:"https://science.nasa.gov/skywatching/"
};

function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function enlaceSeguro(valor) {
  try {
    const u = new URL(valor);
    if (u.protocol !== "https:") return "";

    const host = u.hostname.toLowerCase();

    const permitidos = [
      "nasa.gov",
      "jpl.nasa.gov",
      "stellarium-web.org",
      "esa.int",
      "esahubble.org"
    ];

    if (!permitidos.some(d =>
      host === d || host.endsWith("." + d)
    )) return "";

    return u.href;
  } catch {
    return "";
  }
}

function boton(url,label) {
  const seguro = enlaceSeguro(url);
  if (!seguro) return "";

  return `<a class="btn secondary"
    href="${esc(seguro)}"
    target="_blank" rel="noopener noreferrer">
    ${esc(label)}
  </a>`;
}

function imagen(url,alt) {
  const seguro = enlaceSeguro(url);
  if (!seguro) return "";

  return `<img src="${esc(seguro)}"
    alt="${esc(alt || 'Imagen astronómica')}"
    loading="lazy"
    onerror="this.style.display='none'">`;
}

function fecha(valor) {
  if (!valor) return "Fecha no disponible";

  const d = new Date(valor);

  if (isNaN(d.getTime())) return String(valor);

  return d.toLocaleDateString("es-ES",{
    day:"numeric",
    month:"long",
    year:"numeric"
  });
}

function estado(texto,ok=false) {
  const e = document.getElementById("estado");
  e.textContent = texto;
  e.className = ok ? "ok" : "error";
}

function navegar(nombre) {
  pagina = nombre;

  document.querySelectorAll("main section").forEach(s=>{
    s.classList.toggle("active",s.id === nombre);
  });

  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle(
      "active",b.dataset.page === nombre
    );
  });

  dibujar();
  window.scrollTo(0,0);
}

document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>navegar(b.dataset.page));
});

// Comunicación con Google Apps Script.
// No requiere iniciar sesión.
function cargar() {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/
      .test(API_URL)) {
    estado("Falta configurar API");
    dibujar();
    return;
  }

  const callback = "cosmosCallback_" +
    Date.now() + "_" + Math.floor(Math.random()*100000);

  const script = document.createElement("script");
  let terminado = false;

  const reloj = setTimeout(()=>{
    fallo("La API no respondió en 20 segundos");
  },20000);

  function limpiar() {
    clearTimeout(reloj);
    script.remove();
    delete window[callback];
  }

  function fallo(mensaje) {
    if (terminado) return;
    terminado = true;
    limpiar();

    try {
      const anterior = localStorage.getItem("cosmosCacheV2");
      if (anterior) datos = JSON.parse(anterior);
    } catch {}

    estado("Sin conexión con la API");
    dibujar();
    console.error("COSMOS:",mensaje);
  }

  window[callback] = function(respuesta) {
    if (terminado) return;
    terminado = true;
    limpiar();

    if (!respuesta ||
        !Array.isArray(respuesta.noticias) ||
        !Array.isArray(respuesta.asteroides)) {
      estado("Respuesta API inválida");
      dibujar();
      return;
    }

    datos = respuesta;

    try {
      localStorage.setItem(
        "cosmosCacheV2",JSON.stringify(datos)
      );
    } catch {}

    estado("● Conectado",true);
    dibujar();
  };

  script.onerror = ()=>{
    fallo("No pudo cargarse la respuesta de Apps Script");
  };

  script.src = API_URL +
    "?callback=" + encodeURIComponent(callback) +
    "&cache=" + Date.now();

  document.body.appendChild(script);
}

function estadoDatos() {
  const actualizacion = datos.actualizado
    ? new Date(datos.actualizado).toLocaleString("es-ES")
    : "Todavía no hay datos del servidor";

  return `<div class="notice">
    <strong>Última comprobación de datos:</strong>
    ${esc(actualizacion)}
    <br>
    <small>
      La NASA publica novedades según su propio calendario.
      COSMOS comprueba las fuentes cada 10 minutos.
    </small>
  </div>`;
}

function apod(o) {
  if (!o || !o.imagen) {
    return `<div class="card pad">
      <h3>Imagen astronómica</h3>
      <p>No se ha podido recuperar la imagen automáticamente.</p>
      ${boton(enlaces.imagen,"Ver la imagen oficial")}
    </div>`;
  }

  return `<article class="card">
    ${imagen(o.imagen,o.titulo)}
    <div class="pad">
      <div class="tag">Imagen astronómica NASA</div>
      <h2>${esc(o.titulo)}</h2>
      <small>${esc(fecha(o.fecha))}</small>
      <p>${esc((o.descripcion || "").slice(0,1200))}</p>
      ${boton(o.url,"Ver publicación original")}
    </div>
  </article>`;
}

function articulos(lista,fuente) {
  if (!Array.isArray(lista) || !lista.length) {
    return `<div class="card pad">
      <p>No hay publicaciones disponibles en este momento.</p>
      ${boton(fuente,"Consultar fuente oficial")}
    </div>`;
  }

  return `<div class="card">` +
    lista.map(n=>`
      <article class="article">
        <div class="tag">${esc(n.fuente || "NASA")}</div>
        <h3>${esc(n.titulo)}</h3>
        <small>${esc(fecha(n.fecha))}</small>
        <p>${esc(n.resumen || "")}</p>
        ${boton(n.url,"Leer en la fuente oficial")}
      </article>
    `).join("") +
    `</div>`;
}

function renderInicio() {
  const ultimas = (datos.noticias || []).slice(0,3);

  document.getElementById("inicio").innerHTML = `
    <div class="tag">OBSERVATORIO ASTRONÓMICO</div>
    <h2>Un universo por descubrir ✨</h2>
    ${estadoDatos()}
    ${apod(datos.imagen)}

    <h2>Explora COSMOS</h2>
    <div class="grid">
      <button class="tile" onclick="navegar('noticias')">
        <span class="emoji">📰</span>
        Noticias
        <small>Actualidad espacial</small>
      </button>
      <button class="tile" onclick="navegar('cielo')">
        <span class="emoji">🌙</span>
        Mi cielo
        <small>Luna y observación</small>
      </button>
      <button class="tile" onclick="navegar('explorar')">
        <span class="emoji">🚀</span>
        Misiones
        <small>Exploración del espacio</small>
      </button>
      <button class="tile" onclick="navegar('explorar')">
        <span class="emoji">☄️</span>
        Asteroides
        <small>Aproximaciones previstas</small>
      </button>
      <button class="tile" onclick="navegar('explorar')">
        <span class="emoji">🌌</span>
        Galería
        <small>Fotografías espaciales</small>
      </button>
      <button class="tile" onclick="navegar('aprender')">
        <span class="emoji">🔭</span>
        Aprender
        <small>Descubre el universo</small>
      </button>
    </div>

    <h2>Últimas noticias</h2>
    ${articulos(ultimas,enlaces.noticias)}
  `;
}

function renderNoticias() {
  document.getElementById("noticias").innerHTML = `
    <h2>Actualidad del cosmos 📰</h2>
    <p>Publicaciones científicas y noticias de la NASA.</p>
    ${estadoDatos()}
    ${articulos(datos.noticias,enlaces.noticias)}
    ${boton(enlaces.ciencia,"NASA Science")}
  `;
}

// Fase lunar aproximada, sin acceso a datos privados.
function luna() {
  const ciclo = 29.530588853;
  const referencia = Date.UTC(2000,0,6,18,14);
  const edad = ((Date.now()-referencia)/86400000
    % ciclo + ciclo) % ciclo;

  const iluminacion = Math.round(
    (1-Math.cos(2*Math.PI*edad/ciclo))*50
  );

  const nombres = [
    "Luna nueva",
    "Luna creciente",
    "Cuarto creciente",
    "Gibosa creciente",
    "Luna llena",
    "Gibosa menguante",
    "Cuarto menguante",
    "Luna menguante"
  ];

  const emojis = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  const indice = Math.floor((edad/ciclo*8)+0.5)%8;

  return {
    nombre:nombres[indice],
    emoji:emojis[indice],
    iluminacion
  };
}

function renderCielo() {
  const l = luna();

  document.getElementById("cielo").innerHTML = `
    <h2>Mi cielo esta noche 🌙</h2>

    <div class="card pad" style="text-align:center">
      <div style="font-size:85px">${l.emoji}</div>
      <h2>${l.nombre}</h2>
      <p>Iluminación aproximada: ${l.iluminacion}%</p>
      <small>
        Estimación matemática. No sustituye una efeméride
        astronómica de precisión.
      </small>
    </div>

    <div class="card pad">
      <div class="tag">MAPA ESTELAR</div>
      <h3>¿Qué estrellas hay sobre ti?</h3>
      <p>
        Consulta un mapa del cielo con estrellas,
        planetas y constelaciones.
      </p>
      ${boton(enlaces.stellarium,"Abrir mapa interactivo")}
      <small>
        El mapa se abre en Stellarium.
        No es necesario crear una cuenta COSMOS.
      </small>
    </div>

    <div class="card pad">
      <h3>Observación astronómica</h3>
      <p>
        La visibilidad real depende de la ubicación,
        la hora, la nubosidad y la contaminación lumínica.
      </p>
      ${boton(enlaces.sky,"Consejos oficiales NASA")}
      ${boton(enlaces.luna,"La Luna según NASA")}
    </div>
  `;
}

function renderExplorar() {
  const galeria = datos.galeria || [];
  const asteroides = datos.asteroides || [];

  const fichas = asteroides.length
    ? asteroides.map(a=>`
      <article class="article">
        <h3>☄️ ${esc(a.nombre)}</h3>
        <p>
          <strong>Aproximación:</strong>
          ${esc(a.fecha)}
        </p>
        <p>
          <strong>Distancia nominal:</strong>
          ${Number(a.distanciaKm).toLocaleString("es-ES")} km
        </p>
        <p>
          <strong>Velocidad relativa:</strong>
          ${Number(a.velocidadKmS).toFixed(1)} km/s
        </p>
      </article>
    `).join("")
    : `<div class="pad">
      No se han recibido aproximaciones todavía.
      ${boton(enlaces.asteroides,"Consultar NASA/JPL")}
    </div>`;

  const fotos = galeria.length
    ? galeria.map(f=>`
      <article class="card">
        ${imagen(f.imagen,f.titulo)}
        <div class="pad">
          <h3>${esc(f.titulo)}</h3>
          ${boton(f.url,"Ver original")}
        </div>
      </article>
    `).join("")
    : `<div class="card pad">
      No se han recibido fotografías de la galería.
      ${boton(enlaces.galeria,"Abrir galería oficial NASA")}
    </div>`;

  document.getElementById("explorar").innerHTML = `
    <h2>Explora el universo 🚀</h2>

    ${estadoDatos()}

    <div class="tag">MISIONES ESPACIALES</div>
    <h2>NASA y Artemis</h2>
    ${articulos(datos.misiones,enlaces.artemis)}

    <h2>Asteroides próximos ☄️</h2>
    <p>
      Aproximaciones previstas a la Tierra durante los
      próximos 30 días, hasta 0,05 unidades astronómicas.
      Esto no indica riesgo de impacto.
    </p>

    <div class="card">${fichas}</div>
    ${boton(enlaces.asteroides,"Centro NASA/JPL")}

    <h2>Galería del universo 🌌</h2>
    <div class="gallery">${fotos}</div>

    <div class="card pad">
      <h3>Biblioteca de imágenes NASA</h3>
      <p>
        Busca más imágenes originales de misiones,
        planetas, nebulosas y galaxias.
      </p>
      ${boton(enlaces.galeria,"Explorar biblioteca")}
    </div>
  `;
}

const temas = {
  planetas:{
    titulo:"Los planetas",
    descripcion:"Conoce los mundos del sistema solar, sus atmósferas, satélites y características.",
    url:"https://science.nasa.gov/solar-system/planets/"
  },
  estrellas:{
    titulo:"Estrellas",
    descripcion:"Cómo nacen, cómo evolucionan y qué ocurre cuando agotan su combustible.",
    url:"https://science.nasa.gov/universe/stars/"
  },
  galaxias:{
    titulo:"Galaxias",
    descripcion:"Explora la Vía Láctea y los miles de millones de galaxias que podemos estudiar.",
    url:"https://science.nasa.gov/universe/galaxies/"
  },
  agujeros:{
    titulo:"Agujeros negros",
    descripcion:"Descubre estos objetos extremos y sus efectos gravitatorios.",
    url:"https://science.nasa.gov/universe/black-holes/"
  },
  exoplanetas:{
    titulo:"Exoplanetas",
    descripcion:"Mundos que orbitan estrellas diferentes al Sol y la búsqueda de planetas habitables.",
    url:"https://science.nasa.gov/exoplanets/"
  },
  lunas:{
    titulo:"Lunas del sistema solar",
    descripcion:"Desde nuestra Luna hasta Titán, Europa y Encélado.",
    url:"https://science.nasa.gov/solar-system/moons/"
  }
};

function elegirTema(id) {
  tema = id;
  renderAprender();
}

function renderAprender() {
  const actual = temas[tema];

  const botones = Object.entries(temas).map(([id,t])=>
    `<button class="${id===tema?'selected':''}"
      onclick="elegirTema('${id}')">
      ${esc(t.titulo)}
    </button>`
  ).join("");

  document.getElementById("aprender").innerHTML = `
    <h2>Aprender astronomía 🔭</h2>
    <p>Una biblioteca pública de conocimiento científico.</p>

    <div class="tabs">${botones}</div>

    <div class="card pad">
      <div class="tag">ENCICLOPEDIA NASA</div>
      <h2>${esc(actual.titulo)}</h2>
      <p>${esc(actual.descripcion)}</p>
      ${boton(actual.url,"Aprender en NASA")}
    </div>

    <div class="card pad">
      <h3>Exploración interactiva</h3>
      <p>Recorre el sistema solar y las misiones de la NASA.</p>
      ${boton("https://eyes.nasa.gov/","Abrir NASA Eyes")}
    </div>
  `;
}

function dibujar() {
  renderInicio();
  renderNoticias();
  renderCielo();
  renderExplorar();
  renderAprender();
}

// Arranque de la aplicación.
document.addEventListener("DOMContentLoaded",()=>{
  try {
    const copia = localStorage.getItem("cosmosCacheV2");
    if (copia) datos = JSON.parse(copia);
  } catch {}

  dibujar();
  cargar();

  // Comprobación cada diez minutos.
  setInterval(cargar,10*60*1000);

  // Actualiza al volver a la pestaña.
  document.addEventListener("visibilitychange",()=>{
    if (!document.hidden) cargar();
  });
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(error=>console.warn("SW:",error));
  });
}

</script>
</body>
</html>
